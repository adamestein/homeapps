{% extends "base.html" %}

{% block title %}Utilities: Select {{ type }} Type{% endblock %}

{% block header %}Select {{ type }} Type{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if not submit_on_select %}
            <button type="submit">Continue</button>
        {% endif %}
    </form>

    {% if submit_on_select %}
        <script type="text/javascript">
            $(document).ready(function() {
                $("#id_selected_type").change(function() {
                    if ($(this).val()) {
                        $(this).closest("form").submit();
                    }
                });
            });
        </script>
    {% endif %}
{% endblock %}
